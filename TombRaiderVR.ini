; TombRaiderVR.ini -- place next to TombRaiderVR.dll
;
; If the very first run looks wrong, the fix is almost always one of the two
; sign toggles below. The engine renders Y-flipped (ogl_setPerspAngles writes
; e11 = -1/tanY) and TR world space is Y-down, while OpenVR is Y-up. That is two
; independent flips, so they are exposed rather than hard-coded.
;
;   image upside down in the headset ....... FlipProjectionY
;   world tilts the wrong way when you lean  FlipViewY
;   depth inverted / eyes crossed .......... SwapEyes

[VR]
Enabled=1

; Mode = mono | stereo
;
; mono is the bring-up mode. It composes the head pose onto the game camera and
; renders normally to the monitor: no stereo target, no draw duplication, no
; compositor submission, and the engine keeps its own projection so the field of
; view is unchanged. OpenVR runs as a Background app, so SteamVR just needs to be
; running and tracking -- the game does not become the VR scene application.
;
; Prove tracking, handedness and world scale here first, then switch to stereo.
Mode=stereo

; Rotation-only head tracking. The safe first test: the camera can pivot but
; never be displaced, so a wrong WorldUnitsPerMetre cannot put you inside a wall.
; Set to 1 once looking around behaves correctly.
PositionalTracking=1

; Seated tracking origin rather than standing. Standing space is absolute room
; coordinates -- your head at ~1.6 m becomes ~680 TR units of camera offset
; before you have moved at all. Leave this at 1.
SeatedOrigin=1

; Drop the view by this many world units while Duck is held. 0 = off.
;
; The engine already lowers its camera when Lara crouches, but in VR your
; real head does not move, so the net change reads as far less than a crouch
; should. This adds the rest.
;
; A TR sector is 1024 units and Lara is 762 tall, so 256 is roughly a
; third of her height. Raise it if crouching still feels too tall.
CrouchDrop=256

; Units per frame it eases in and out at. Instant would be a lurch, which
; in VR is worse than the problem. About 6 frames at the default.
CrouchDropSpeed=24

; Fade the view out when your HEAD leaves the map.
;
; Positional tracking puts the engine camera where Lara is and adds your
; head offset on top, so the engine has no idea your head moved. Lean far
; enough and it crosses a wall and you see out of the level.
;
; Tested against ROOM BOXES deliberately. A room box is the level shell;
; crates, doors and enemies are ITEMS living inside one. So putting your
; head through a crate keeps you inside a room and does nothing at all --
; only leaving the level geometry triggers the fade.
;
; Uses OpenVR's compositor fade rather than drawing anything: no GL work,
; and the runtime does the smoothing.
;
; TR4 and TR5 only. TR6 uses cells rather than this room array.
WallFade=0

; World units OUTSIDE the nearest room box where the fade starts, and
; where it reaches full. A TR sector is 1024, so 64 is a few inches -- it
; begins only once you are genuinely through the surface, not when you
; brush it. Raise WallFadeStart if it triggers when you did not mean it.
WallFadeStart=0
WallFadeFull=8

; How dark it goes at full. 1.0 = black. Lower to keep some sense of
; where you are while out of bounds.
WallFadeMax=1.0

; Ignore the VERTICAL axis when deciding whether the head left the level.
;
; ON by default, and it needs to be. A standing player's head clears a
; room's ceiling constantly -- low corridors, crouched spaces, anywhere the
; ceiling sits near head height -- and none of that is leaving the map.
; The failure this fade exists for is horizontal: leaning THROUGH a wall.
;
; With this on, a head above the ceiling or below the floor of a room it is
; horizontally inside still counts as inside, and nothing fades.
WallFadeIgnoreVertical=1

; Log what the wall-fade test actually sees, about once a second.
;
; Turn this on if the fade never fires, or fires when it should not. It
; prints the head and camera world positions, how far your head is leaning
; from the camera, whether the room test had data at all, and how many
; units outside the nearest room box you are.
;
; "It never triggered" is not a measurement on its own -- it could mean
; the head never leaves the rooms, or that the test is not running. Those
; want different fixes.
WallFadeDebug=0

; TR world units per metre -- the main scale control.
;
; RAISE IT if the world feels too big and depth feels flat. Those are the same
; symptom: your IPD is fixed, so a world rendered too large leaves the eye
; separation proportionally too small, which reads as both "enormous" and
; "no depth". Lowering it grows the world and weakens depth.
;
; 423 comes from Lara's 762-unit height at ~1.8 m, which is a starting point,
; not gospel. Tune it live with the hotkeys below and copy back what feels right.
;
; NOTE: "too big and flat" was ALSO the signature of the uViewMatrix translation
; bug -- see EyeOffsetViaModel. Rule that out before chasing this number.
WorldUnitsPerMetre=423

; Multiplier on eye separation only, leaving world size alone. Use this only if
; the size feels right but depth still reads flat. 1.0 = physically honest.
IpdScale=1.0

; Live tuning hotkeys, logged so you can copy the final value back here.
;   numpad +      SMALLER world, STRONGER depth   (raises WorldUnitsPerMetre)
;   numpad -      BIGGER world, WEAKER depth
;   numpad * / /  IpdScale up / down
;   numpad 0      reset both to the values in this file
;
; Step per press. 1.25 = 25%, so three presses roughly double. Scale differences
; are hard to judge below about 2x, which is why this is not a fine adjustment.
ScaleStep=1.25
ScaleUpKey=0x6B
ScaleDownKey=0x6D
IpdUpKey=0x6A
IpdDownKey=0x6F
ResetTuningKey=0x60

; 0 = use the size OpenVR recommends.
EyeWidth=0
EyeHeight=0
SuperSample=1.0

FlipProjectionY=1
FlipViewY=1
SwapEyes=0

; Vertically flip the eye texture when handing it to the compositor.
; Leave at 0. The engine's Y-negated projection already cancels TR's Y-down
; world, so the eye texture is an ordinary GL render and the compositor wants
; default V bounds.
;   upside down in the HMD but fine on the monitor .. set this to 1
;   upside down in BOTH ......................... change FlipProjectionY instead
FlipSubmitV=0

; --- per-eye rendering ------------------------------------------------------

; Where the per-eye TRANSLATION is applied. Leave this at 2.
;
;   0 = uViewMatrix translation column. BROKEN: 38 of the engine's 125 vertex
;       shaders transform position as dot(uViewMatrix[i].xyz, p.xyz) -- rotation
;       ONLY, never reading the translation column. Invisible to them, so: no
;       parallax, no depth, everything at infinity (reads oversized), and dead
;       IpdScale / WorldUnitsPerMetre keys.
;   1 = uModelMatrix translation column. ALSO BROKEN: skinned geometry goes
;       through uJoints[72*3], not uModelMatrix, so characters do not move with
;       the world and float outside the map.
;   2 = uProjMatrix + translate(d). Depth and scale work, but the world swims
;       when you rotate your head: d = (R_e - I)*t_g + t_e, and t_g is ~82000
;       units, so any head rotation makes the first term thousands of units.
;   3 = uProjMatrix composed with the WHOLE eye transform, view matrix left
;       untouched. THE FIX. Untouched, both shader families agree on the
;       view-space position; E is metres-scale so head rotation cannot blow up.
EyeOffsetMode=3

; Apply the per-eye view matrix at all. 0 leaves the game's own camera in both
; eyes, so the only remaining difference is the frustum shear -- a constant
; sideways shift that carries no depth. Diagnostic only.
PerEyeView=1

; Per-eye projection:
;   0 = the engine's own. NOT a clean control -- it also drops the HMD field of
;       view and squeezes a 1.78-aspect frustum into a 0.93-aspect viewport, so
;       it changes two things at once.
;   1 = the HMD's true asymmetric frustum. Correct. Leave it here.
;   2 = HMD field of view, symmetrised: same total extent per axis, shear forced
;       to zero. Single-variable test for the shear. Expect double vision -- the
;       headset optics assume the asymmetric render and misplace each eye by
;       ~15 degrees without it.
PerEyeProjection=1

; --- diagnostics (all off) --------------------------------------------------

; Red bar burned into the left half of the eye target, blue into the right.
; Reads eye mapping directly:
;   red left, blue right ... halves map to eyes correctly
;   both bars in both eyes . submit bounds are being ignored
;   same colour both eyes .. both eyes are getting the same half
;   no bars at all ......... what you see is not this texture
EyeMarkers=0

; Yaw the RIGHT eye's view by this many degrees. 0 = off.
; Tests whether the view matrix drives rendering at all, with an effect far too
; large to mistake for subtlety. At 20 the two eyes visibly look in different
; directions. Rotation is honoured by every shader; translation is not.
DebugEyeYawDegrees=0

; Leave the 2D layer (HUD, menus, subtitles, fades) on the flat path. It is
; still drawn into both eyes, just without per-eye matrices.
FlatHud=1

; Distance in metres at which the flat 2D layer sits. 0 = leave it alone, which
; double-visions: the 2D layer uses the engine's ortho projection, identical in
; both eyes, but the headset optics apply a fixed ~15-degree per-eye correction
; assuming an asymmetric render, so an unshifted image gets pulled apart.
; Distance in metres at which the 2D panel sits. Raise it to push the HUD and
; menus further away. 0 = leave the 2D layer alone (it will double-vision).
HudDepthMetres=4.0

; Horizontal angular width of the 2D panel in degrees, as seen from the game
; camera. The engine's 2D layer fills the flat screen; across the headset's ~94
; degree field of view that would be overwhelming, so it goes on a panel this
; wide instead. Vertical follows the screen aspect. Raise for a bigger panel,
; lower for a smaller one. Ignored when HudLockToHead=1.
HudSizeDegrees=55.0

; 0 = the 2D layer is a quad fixed in the GAME camera's frame, so it stays put
;     in the world while your head turns. This is what you want.
; 1 = old behaviour: welded to your head, swings with every rotation.
HudLockToHead=0

; Negate Y when lifting the 2D layer onto the panel. Leave at 1.
; The engine's ortho already flips Y (TR 2D space is Y-down), and the per-eye
; projection expects Y-DOWN input, so without this the layer is flipped twice.
; That inverts it AND reverses triangle winding, so backface culling removes the
; whole HUD -- leaving only elements drawn with culling off, upside down.
HudFlipY=1

; Distance in metres for full-screen passes that bypass uProjMatrix entirely.
; Five of the engine's shaders write gl_Position = vec4(aCoord, 1.0) -- straight
; to clip space, no matrix at all -- and pre-rendered video runs through that
; path. No matrix can move them, so the viewport is shifted per eye instead.
; 0 disables the shift entirely.
VideoDepthMetres=6.0

; 0 = the video panel is anchored to the GAME camera, so it stays put in the
;     world while your head turns, and leaves view if you turn away.
; 1 = welded to your head.
VideoLockToHead=0

; Horizontal angular width of the video panel in degrees, seen from the game
; camera. Also controls how flat it looks: the panel's four corners are
; projected and the viewport fitted to their bounding box, which gives correct
; position and perspective SIZE. What is left is keystone -- an off-axis quad
; should go trapezoidal and a bounding box stays rectangular -- and that error
; grows with width. 50-70 is a good cinema size; above ~90 it shows at the edges.
VideoSizeDegrees=60.0

; 1 = capture the video pass into an offscreen texture and replay it as a REAL
;     quad. Removes keystone entirely: it foreshortens, keystones and rolls like
;     the world does, because it is world geometry. Costs one framebuffer bind
;     and two quad draws per video frame, and only during video -- the branch
;     never runs in gameplay. It also rasterises the video once instead of
;     twice, so it nearly pays for itself.
; 0 = viewport fit (corner bounding box). Correct position and size, residual
;     keystone off-axis.
VideoOffscreen=1

; Flip the captured video vertically on replay. Only if it comes out upside down.
VideoFlipV=0

; In TR6, use the offscreen video panel ONLY while a video is actually playing.
; Leave at 1.
;
; TR6 composites its offscreen scene to the backbuffer through a
; clip-space-direct shader -- the same signature as an FMV quad -- so the shader
; test alone would capture the whole game and turn it into a floating panel.
; Hooking fmvShow gives an exact "a video is on screen this frame" signal, so
; TR6's cutscenes get the real-geometry panel (no keystone, no tilt on head
; roll) while its gameplay and menus are left alone.
VideoSkipGame6=1

; Alternate-eye rendering for TR6 (Angel of Darkness). Leave at 1.
;
; TR4/TR5 draw straight to the backbuffer, so every world draw can be issued
; twice into the two halves of one double-wide target. TR6 cannot work that way:
; it renders the scene into the engine's own 2560x1440 offscreen textures and
; composites at the end, and the composite samples those whole with 0-1 UVs.
; Measured: 572970 of 579945 world draws offscreen, against ~9% in TR4/5.
;
; So each FRAME is rendered entirely as one eye and lands in that eye's half.
; Nothing is resized, nothing is duplicated, and both eyes are stereo-correct.
;
; The cost is real: each eye updates at HALF the frame rate (45 Hz of a 90 Hz
; headset). If that judders too much for you, set this to 0 -- TR6 then renders
; flat but at full rate.
; ON. This was switched off only to test the depth-reprojection warp
; against it; that warp was abandoned (Tr6Reproject=0, its colour fetch
; returned black and was never explained) and this never went back on.
AlternateEyeGame6=1

; How many offscreen world draws a frame needs before alternate-eye engages.
;
; AER is only worth its half-rate cost when there is an offscreen 3D scene to
; reach. The TR6 main menu and the FMVs are 2D -- they draw straight to the
; backbuffer, so ordinary per-draw duplication handles them at FULL rate and
; looks better doing it. Gameplay runs ~800 offscreen world draws a frame;
; menus and video are near zero, so the count separates them cleanly.
;
; Raise it if a menu still drops to half rate; lower it if gameplay does not
; engage. 0 would force AER on for every TR6 frame.
AlternateEyeMinOffscreen=50

; --- controllers ------------------------------------------------------------

; Present the Oculus Touch controllers to the game as an Xbox pad.
;
; The game resolves XInput through GetProcAddress into a function-pointer
; global, so there is no import to hook and no virtual-pad driver (ViGEm etc.)
; needed -- we overwrite that pointer. inputUpdate() polls it every frame and
; switches to INPUT_TYPE_XB on the first input, so the game adopts the Xbox
; control scheme and button prompts on its own. A real pad, if plugged in, is
; merged rather than replaced.
;
;   Move    left stick              Jump    A  (right hand, LOWER)
;   Look    right stick             Roll    B  (right hand, UPPER)
;   Action  Y  (left hand, UPPER)   System  X  (left hand, LOWER)
;   Walk    left stick + RIGHT GRIP Duck    LEFT GRIP
;   Equip   left trigger (hold)     Shoot   right trigger
;   Sprint  left stick click        Photo   both grips
;
; Walk is the right grip rather than a face button so it can be held while the
; left thumb keeps moving. The game binds Walk to XInput X, so the grip emits X
; -- and RIGHT_SHOULDER as well, so the Photo Mode chord (LB+RB) still works.
GamepadEnabled=1

; Log the raw OpenVR legacy button masks whenever they change. Touch's button
; ids differ between runtimes, so if a button lands in the wrong place this says
; which mask it actually set. Leave at 0 for normal play.
GamepadLogButtons=0

; Hold R3 (right stick click) to turn the LEFT stick into a D-pad.
;
; R3 is the modifier rather than L3 because L3 is Sprint, and sprint here is
; held WHILE running forward -- "hold L3, push the stick forward" is already a
; gesture in play, so reusing it for D-pad up would mean choosing between them.
; R3 was the only spare input on the pad.
;
; A plain R3 click, with the stick centred, still emits RIGHT_THUMB exactly as
; before -- the D-pad only appears once the left stick is actually deflected,
; so nothing that relied on R3 is lost. The left stick's movement axes are
; zeroed while shifted, so you do not walk and press a direction at once.
;
; Only the dominant axis fires, so a flick cannot emit up and left together and
; move a menu selection twice.
DpadShift=1

; Hold Y + LT for this many seconds to send the Xbox Menu button (XInput START).
;
; Touch has no Start or Back of its own, so both have to come from somewhere.
; The System button on the left hand's lower face sends one of them (see
; GamepadMenuUsesBack); this chord reaches the other without spending a button.
;
; The hold is what separates the chord from real play: Y is Action and LT is
; Equip, so the pair does occur naturally. One second is comfortable but IS
; within reach of normal play -- raise this if it ever fires unintentionally.
;
; It sends a PRESS, not a latch -- Menu toggles the pause screen itself, and a
; held START would never look like a clean press to the game. It fires once per
; hold; release and re-hold to send another. Y and LT are suppressed from the
; moment it fires until you let go, so it does not keep grabbing afterwards.
;
; 0 disables the chord entirely.
MenuChordSeconds=1.0

; How long the synthesised Menu press is held, in seconds.
MenuChordPressSeconds=0.15

; How far the left stick must travel before a shifted press registers, 0-1.
; Raise it if directions trigger too easily, lower it if they feel stiff.
DpadShiftDeadzone=0.5

; Which XInput button the left hand's LOWER face button sends.
;   1 = BACK  -- the System menu. Default.
;   0 = START -- the pause/inventory menu.
; inputUpdate() decodes BACK to internal key 0x62 and START to 0x63; which one a
; given screen treats as System lives in the game DLLs, so this stays switchable.
GamepadMenuUsesBack=1

; --- reverse engineering ----------------------------------------------------

; Log the DLL-side return address of each distinct call into vid_setPass and
; ogl_drawVB, as "module+RVA".
;
; The game DLLs ship without PDBs, so this is how we find their render code
; without searching ~1800 unnamed functions: the DLL must call across into the
; engine to draw, and the return address at our hook is a code address inside
; the DLL. One gameplay frame gives exact RVAs to open in Ghidra.
;
; Deduplicated and capped at 64 sites per hook, but still verbose. Off for play.
LogCallsites=0

; Draw every room in the level, defeating portal culling. TR4 and TR5.
;
; The engine submits only rooms reached through a camera-facing portal, so
; looking away from the game camera finds nothing drawn. The culling lives in
; tomb4.dll -- the exe has none, and widening the projection it hands the game
; was measured to change nothing.
;
; This hooks each DLL's GetRoomBounds and, after its portal traversal, appends
; every remaining room to the draw list and gives them full-screen clip rects.
; It is exactly what the engine already does for rooms flagged 0x40000.
;
; COST: no visibility culling at all -- every room every frame. TR4 rooms are
; small, but a big level will cost frame rate. Watch the log:
;   rooms[TR4]: traversal found 12, forced 78 more, drawing 90 of 90
;
; TR6 is a different engine and is not covered yet.
; NOTE: PortalWiden used to live here -- it widened the engine's portal
; rectangle, on the theory that VR's wider FOV was being culled away. It was
; REMOVED after measuring: swept to 200% of screen each way (lateral culling
; effectively off) it changed neither the geometry nor the frame rate, and the
; same test on TR6 at 20x was equally inert. The rectangle was never the
; limiter -- the traversal runs in the game camera's space and does not rotate
; with your head, so portals beside or behind it fail the near-plane test long
; before any rectangle is consulted. PortalHops is what actually fixed it.

; Expand the visible set along PORTAL CONNECTIVITY by this many hops. 0 = off.
; 1 or 2 is the useful range. Numpad + and - adjust it live.
;
; MEASURED, and the reason this exists: widening the portal rectangle does NOT
; fix geometry going missing when you turn your head. Swept to 200% of screen
; each way -- lateral culling effectively off -- it changed neither the geometry
; nor the frame rate (44.5 -> 45.0 fps across the whole sweep), and the same
; test on TR6 at 20x was equally inert.
;
; The rect was never the limiter. The traversal runs in the GAME CAMERA's space:
; VR is injected at the shader uniform, so the engine's own view matrix stays
; the game's and the culling does not rotate with your head. A portal beside or
; behind the game camera fails the NEAR-PLANE test inside the clipper, which is
; checked before the rectangle is ever consulted -- so no rect can rescue it.
;
; Connectivity has no orientation bias: a room through the door behind you is
; one hop away whichever way the game camera faces. It also keeps the property
; that fixed room 215 -- only rooms joined by a real portal get in, so stacked
; overlaps and flip twins stay out, because no portal opens onto one.

; Stop the hop expansion after adding this many rooms. 0 = no budget.
;
; MEASURED: hop depth is cheap and SATURATES. Going from 2 hops to 3 on a
; 242-room TR5 level added about ten rooms (30-45 became 42-54) and moved the
; frame rate not at all -- 44.5-45.0 fps either way. Connectivity runs out long
; before the draw list does.
;
; That makes fixed depth the wrong control on its own: too shallow and geometry
; goes missing down a long sightline, too deep costs nothing in a corridor but
; could explode in a dense warren. So the depth above is set generously and this
; budget binds only where connectivity really is dense. When it binds, the log
; says so and names the key to raise it.
;
; F9 raises it by 16, F8 lowers it. F7 / F6 still adjust the depth.



; F7 / F6 adjust PortalHops live. Each press logs the new value.
; NOT numpad +/- : those are ScaleUpKey and ScaleDownKey, and a shared
; binding runs BOTH actions -- adjusting hops also moved the world scale.


; TR6 only. Widen its PORTAL TRAVERSAL by this factor; 1.0 leaves it alone.
;
; TR6 culls the way TR4 and TR5 do, with floats instead of shorts: a portal walk
; that carries a screen-space rectangle and clips it at every doorway. It starts
; from a root rect of {-1,-1,1,1} -- the flat screen in NDC -- and the headset
; sees wider than that, so cells off to the side are never visited or drawn.
; This scales the root rect for the traversal only and restores it immediately,
; so no engine state is left modified.
;
; (Widening the AABB frustum test instead was measured useless: at 20x it
; changed no geometry and cost no frame rate, because ~90% of its rejections
; are near/far rather than lateral. The portal rect is the one that hides
; geometry -- it never reaches that test.)
;
; 2.0 is roughly double the lateral reach. Costs draw calls in proportion.
Tr6CullWiden=1.0

; Put the root rect back after the traversal. Leave at 0.
; Those four floats are also the frustum bounds the per-object test uses
; later in the frame, so restoring them culls exactly the cells the wider
; traversal just found -- measured, that is why widening appeared to do
; nothing. Here only as a switch in case it ever explains a regression.
Tr6CullRestore=0

; TR6 only. Reports three times what TR6's offscreen scene framebuffer uses for
; a depth attachment, and whether it still holds real depth when the frame is
; presented. Decides whether the second eye could be reprojected from the first
; instead of alternating frames. Costs a GPU sync on three frames, then nothing.
Tr6DepthProbe=0

; Synthesise TR6's second eye from the rendered one plus the scene depth buffer,
; instead of alternating eyes frame by frame.
;
; AER shows one eye the previous frame at all times, and that time difference
; between the eyes IS the judder -- frame rate cannot fix it. This warps the
; rendered eye into the other one, so both come from the same instant.
;
; It cannot invent what the rendered eye never saw: where the second eye should
; see past an edge the image stretches instead, and transparent surfaces (which
; write no depth) shift with whatever is behind them. Set to 0 to go back to
; alternate-eye rendering.
Tr6Reproject=0

; Warp grid width in cells, height follows at 9/16. Higher tracks depth
; discontinuities more closely and costs more vertices. 320 is ~115k triangles.
Tr6ReprojectGrid=320

; Paint the warp grid with its source UV instead of the game image. Diagnostic:
; a colour gradient in the synthesised eye means the grid is rasterising and the
; colour fetch is what fails; a black half means the grid is not landing at all.
;   1 = source UV as colour   -- does the grid rasterise, and where
;   2 = colour, alpha forced   -- the image fetch, ignoring alpha
;   3 = colour at a fixed UV   -- the texture binding, ignoring coordinates
;   4 = the depth the vertex shader read, as greyscale (useless when
;       the real range is 0.93..1.0 -- that reads as flat white)
;   5 = the same depth, banded, so any variation is visible
;   6 = the colour fetch amplified x16 -- tells black from very dark
;   7 = the DEPTH texture sampled in the fragment stage instead of
;       the vertex stage, banded
;   8 = texelFetch instead of texture(): no filtering or sampler state
Tr6WarpDebug=0

; Diagnostic. DrawAllRooms makes two separate changes: it appends rooms to the
; draw list, and it widens every listed room's clip rect to the full screen.
; Set this to 0 to keep the first and drop the second. Forced rooms then will
; not render at all -- that is expected; it is there to tell the two apart.
DrawAllRoomsClipRect=1

; Never force a flip room's inactive storage copy into the draw list.
;
; A flip room is a second copy of a piece of level holding its other state: the
; flooded version of a room, the collapsed floor, an area that changes between
; visits. Both copies are real rooms at the SAME world position and both carry
; real geometry, but only one is live at a time. Drawing both puts two versions
; of one space in the frame and lets draw order decide which you see -- geometry
; from the wrong state of the level, walls you can walk through, walls that are
; not there at all.
;
; The link is read from the engine's own flipped_room field, whose invariant
; DoFlipMap maintains: the live room names its storage copy, the storage copy
; holds -1. This replaced an earlier guess that matched rooms by shared world
; position, which was measured wrong (78 of 242 rooms in Streets of Rome).
;
; Leave this on. It is here to A/B the fix, not to be turned off.

; Cap on how many rooms the override may force per frame. -1 = no cap.
;
; This is the cost control. The override appends rooms the engine's own portal
; traversal did not reach, and on a small level that can mean nearly the whole
; map: TR5 Streets of Rome has 116 rooms, the traversal finds 3 to 12 of them,
; and forcing the rest drew 115 every frame -- about ten times the engine's own
; working set, doubled again for stereo. Affordable with stock textures, a
; slideshow with the HD-texture build.
;
; Candidates are sorted nearest-first, so the cap keeps the rooms most likely to
; be visible and drops the far ones. Numpad 2/3 (+-1), 4/6 (+-10) and 5 (no cap)
; retune it live in the headset -- fly it up until geometry stops popping in,
; then put that number here.

; Toggle DrawAllRooms in the headset, numpad 1 by default. Stand still, press
; it, and the same spot is drawn both ways with nothing else changed.
DrawAllRoomsKey=0x61

; Room indices the override must never force into the draw list. Comma or space
; separated. Indices are per level, so a list that helps one level means nothing
; in another. Rooms the game's own portal traversal reached are unaffected --
; this only ever removes rooms that would have been forced.
; MEASURED: room 215 in TR5 is NOT a flip room -- DrawAllRoomsSkipFlip does not
; catch it, confirmed by a run where dropping the forced-room cap from 20 to 19
; was what removed it from the list. It is also not explained by its flags: its
; only unusual one (0x4000) is a lighting bit shared by 19 well-behaved rooms.
; Cause still unknown, so the per-index exclusion stays until it is understood.
; LOAD-BEARING AGAIN -- do not clear this without re-testing room 215.
;
; It was briefly removed on the argument that portal reachability had fixed 215
; structurally. That was true only while PortalHops was 0: pure traversal cannot
; reach a stacked room. Hop expansion CAN -- it adds any portal-connected room,
; and draws it without a portal clip -- so if a portal reaches 215 it comes back
; in full and overlaps the space you are standing in. Clearing this broke the
; culling again; restoring it is part of the revert to the known-good state.
; DrawAllRoomsExclude=215

; Issue every draw twice, once per eye. Turn off to keep matrix injection but
; draw once -- useful for telling a matrix problem from a duplication problem.
DuplicateDraws=1

MirrorToWindow=1

; 0 = keep whatever near/far the current pass set.
NearClip=0
FarClip=0

; Log the first injected projection and view to TombRaiderVR.log.
VerboseFirstFrame=1

; Frame-graph trace. Logs every render-target transition and the world/2D draw
; counts against each. This is what tells us where the 3D scene is actually
; drawn -- the one thing stereo depends on.
;
; Set TraceFrames=0, get into ACTUAL GAMEPLAY (not a menu or loading screen),
; then press the TraceKey. A menu frame has a handful of draws; gameplay has
; hundreds, and the log says so if it looks like a menu.
TraceFrames=0

; Virtual-key code for the capture hotkey. 0x79 = F10, 0x78 = F9, 0x7A = F11.
TraceKey=0x79

; Optional frame-number trigger instead of the hotkey. 0 = hotkey only.
TraceStartFrame=0

; Expand the engine's visible set along PORTAL CONNECTIVITY by this many hops.
; 0 = off. This is what fixes geometry going missing when you turn your head.
;
; The engine's traversal runs in the GAME CAMERA's space -- VR is injected at
; the shader uniform, so the engine's own view matrix never rotates with your
; head. A portal beside or behind the camera fails the near-plane test inside
; the clipper, so widening its rectangle does nothing (measured: 200% of screen
; each way changed neither geometry nor frame rate). Connectivity has no
; orientation bias -- a room through the door behind you is one hop away
; whichever way the camera happens to face.
PortalHops=2

; Never hop into a room that occupies the space you are standing in.
;
; Hop expansion draws what it adds with a FULL-SCREEN clip rect, so a room
; overlapping yours is drawn unclipped and its geometry hangs in the air
; around you -- a phantom texture that vanishes as you approach, because the
; engine's own traversal then reaches the room properly.
;
; Stricter than the AABB overlap test that was tried and abandoned: that
; compared two rooms and rejected six legitimate pairs, because TR rooms
; normally overlap by a shared wall sector where they abut. Containing the
; CAMERA is a much narrower claim -- exactly one room should.
;
; Set to 0 to confirm a phantom texture is caused by this.
HopSkipCameraOverlap=0

; Also skip hop rooms STACKED directly above or below you -- same XZ
; footprint, different height.
;
; This is the grate case. A room under a floor grating is one hop away
; through a floor portal, and hop rooms are drawn with a FULL-SCREEN clip
; rect -- so it renders across your whole view instead of through the grate
; opening, reading as a texture floating where you stand.
;
; Identified by diffing three probes: one room was present only while the
; phantom was visible, and it sat directly below the camera.
;
; Applies only from the SECOND hop outward. The room directly under a grate
; you are standing on is ONE hop away and is genuinely visible through it,
; so that one is kept -- skipping it would trade a phantom for missing
; geometry. The measured phantom was three hops away (it appeared only when
; hops went 2 -> 3), so depth separates "you can see into it" from "it is
; nowhere near your sightline".
;
; Set to 0 to compare.
HopSkipStacked=0

; Skip hop rooms beside you at your own height that take MORE THAN ONE
; portal to reach. 0 = off; otherwise the XZ distance in world units that
; counts as "beside you". A TR sector is 1024.
;
; Measured from three probes at a phantom: the offending room was 721 units
; away with the camera inside its vertical span, while rooms equally close
; sat at other heights and behaved, and rooms at the same height were
; 3700-17000 units off. Spatially adjacent but topologically distant is
; geometry you have no sightline to, and hop rooms are drawn unclipped.
HopSkipNearDist=0

; Connectivity expansion for TR6, which is a different renderer to TR4/TR5:
; cells rather than rooms, and a heap-allocated visible set rather than a fixed
; array. 0 = off.
;
; TR6's two earlier fixes were both rectangle widenings and both measured inert
; at 20x. That is now explained rather than mysterious: the same widening was
; inert on TR4/TR5 because culling runs in the GAME CAMERA's space, so a portal
; beside or behind the camera fails the near-plane test before any rectangle is
; consulted. Connectivity has no orientation bias, which is why it worked there.
;
; Costs more here than in TR4/TR5: TR6 already renders alternate-eye at half
; rate, so every extra cell is paid for twice over.
;
; SET THIS TO 0 if TR6 misbehaves -- it writes into an engine-owned list, so it
; is the first thing to rule out.
; OFF -- MEASURED, and this time the test was valid.
;
; The expansion now runs between build and draw (hooked at FUN_1801a5900),
; so the enlarged list genuinely reaches the renderer. Cells went from the
; 1-27 the engine finds up to 43 of the level's 46, and geometry was still
; missing. Cell visibility is not what limits TR6.
;
; WHAT ACTUALLY GATES IT (tomb6.dll!FUN_1801a4380, read from the decompile):
;   each of an object's 8 AABB corners is transformed by the matrix at
;   view+0x80 and given an outcode:
;       z < 0            -> 0x10   (behind the near plane)
;       z > w            -> 0x20
;       x < w*rect.left  -> 4      rect bounds are FRACTIONS OF W,
;       x > w*rect.right -> 8      i.e. an NDC window
;       y < w*rect.top   -> 1
;       y > w*rect.bottom-> 2
;   the outcodes are ANDed; the object is drawn only if the result is 0.
;
; So the rect can only bound x and y. Nothing it can be set to rescues a
; corner with z < 0, and the transform uses the GAME CAMERA's matrix, which
; never rotates with the head. Geometry behind the game camera is dropped by
; the near-plane bit before the rect is consulted -- exactly the TR4/TR5
; story, and why every rect widening here was inert, 20x included.
;
; The untried lever is the MATRIX at view+0x80, not the rect.
Tr6PortalHops=0

; Widen the matrix TR6's per-object cull transforms boxes by.
;
; This is the lever every earlier TR6 attempt missed. The cull
; (tomb6.dll!FUN_1801a4380) transforms an object's 8 box corners by the
; matrix at view+0x80 and outcodes them: z<0 (behind near), z>w, and x/y
; against the cell rect -- but the rect bounds x and y only, as fractions
; of w. No rect can rescue a corner behind the near plane, which is
; exactly what happens when you turn your head away from the game camera.
; That is why the 20x rect widenings were inert.
;
; Tr6CullFov divides the matrix X and Y rows: a wider field of view for
; CULLING ONLY. 1.0 = off. Try 2.0 or 3.0 first -- it is the safer of the
; two and reaches geometry to the sides.
; OFF. No effect at fov x2 + pull back 2048, and the pointer this
; writes through was never verified: Ghidra shows FUN_1801a6530 with
; five parameters while the call site passes one, so params 2-5 are
; the decompiler's inference from register and stack reads. param_5
; was taken on faith as the view. It may not be, in which case this
; was writing 16 floats somewhere it had no business writing.
; Verify the pointer (log the matrix and check it looks like a
; projection) before turning this back on.
Tr6CullFov=1.0

; Approximates standing the cull camera back this many view-space units.
; This is the one that reaches the near-plane bit, i.e. geometry BEHIND
; you. 0 = off. World units; a TR sector is 1024, so 2048-4096 is a couple
; of rooms' worth. An approximation, not a derivation -- only the combined
; matrix is available, so it assumes P22 is about 1 and P23 is 1.
;
; The matrix is saved on entry to the cull and restored on exit, so this
; cannot reach the actual rendering or compound across frames. If the
; IMAGE itself distorts or zooms, that assumption is wrong -- set both
; back to 1.0/0 and say so.
Tr6CullPullBack=0

; Before adding a hop room, test the portal we would reach it through against
; the ACTUAL HEADSET FRUSTUM.
;
; Hop expansion adds any portal-connected room and draws it WITHOUT a portal
; clip, so a room that is connected but not actually visible through that
; doorway still gets drawn -- and where it shares world space with somewhere you
; can see, you get foreign geometry over your own. That is the room-215 bug.
;
; The engine already does this test; it just does it from the game camera. This
; does it from the head, which is the piece that was missing. Set to 0 to get
; the old behaviour back for comparison.
; OFF until proven. The first version transformed portals using the view
; matrix translation column, which is not what a view matrix carries here --
; the error scaled with world coordinates, so it behaved on a 116-room level
; and rejected essentially every portal on a 242-room one, which is what took
; your geometry. Now uses rotation only with the camera position from the
; engine globals. Set to 1 to try it; watch the "head test" ratio in the log.
PortalHeadTest=0

; How far outside the frustum a portal may sit and still count as visible, in
; NDC (0.35 = 35% of half-width). Generous on purpose -- losing geometry is the
; worse failure. Raise it if anything vanishes at the edges, lower it if
; unwanted rooms still get through.
PortalHeadMargin=0.35

; Legacy: append rooms by DISTANCE, ignoring portals. Superseded by PortalHops
; and kept only for A/B. Proximity is the wrong criterion -- it will add a
; stacked room sharing world space with the one you are standing in.
DrawAllRooms=0

; Room indices hop expansion must never add. Comma or space separated, per level.
;
; Not a fix -- what makes room 215 special has never been identified, and three
; general mechanisms (flip detection, portal-rect widening, AABB overlap) all
; failed to characterise it. But it is one line and it demonstrably works, so it
; stays until the head test above is proven.
DrawAllRoomsExclude=215,12

; Per-draw state dump: which matrix carries the difference between one drawn
; element and the next -- projection, view, or model. Get the screen in
; question up, then press DumpKey. One line per draw, logged before any of our
; substitutions, so what appears is what the ENGINE set. 0 = disabled.
DumpDraws=0

; Virtual-key code that arms the dump. 0x78 = F9.
DumpKey=0x78
